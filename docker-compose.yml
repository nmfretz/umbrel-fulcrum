services:
  app:
    build: .
    depends_on:
      - fulcrum
      - bitcoind
    environment:
      ELECTRUM_HIDDEN_SERVICE: "notyetset.onion"
      ELECTRUM_LOCAL_SERVICE: "localhost"
      ELECTRUM_PUBLIC_CONNECTION_PORT: "50002"
      ELECTRUM_HOST: fulcrum
      FULCRUM_PORT: "50002"
      FULCRUM_STATS_PORT: "8080"
      BITCOIN_HOST: bitcoind
      RPC_PORT: "18443"
      RPC_USER: umbrel
      RPC_PASSWORD: umbrel
    ports:
      - "3006:3006"
    restart: on-failure

  fulcrum:
    image: cculianu/fulcrum:v2.1.2@sha256:0af448db05f259206a55d68d099a4742168e9eaedb007e8f700b31920653375f
    init: true
    depends_on:
      - bitcoind
    environment:
      TCP: 0.0.0.0:50002
      ADMIN: 0.0.0.0:8000
      STATS: 0.0.0.0:8080
      BITCOIND: bitcoind:18443
      RPCUSER: umbrel
      RPCPASSWORD: umbrel
      PEERING: "false"
      ANNOUNCE: "false"
      DATA_DIR: /data
    command: Fulcrum -D /data _ENV_
    volumes:
      - ./data/fulcrum:/data
    ports:
      - "50002:50002"
    restart: on-failure

  bitcoind:
    image: bitcoin/bitcoin:28.1@sha256:f332e1117453886b704e8f985dc21594917e79422860effe7842f2aa45a3ac6e
    command:
      - -regtest=1
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=umbrel
      - -rpcpassword=umbrel
      - -rpcport=18443
      - -port=18444
      - -fallbackfee=0.0002
    volumes:
      - ./data/bitcoin:/home/bitcoin/.bitcoin
    restart: on-failure
